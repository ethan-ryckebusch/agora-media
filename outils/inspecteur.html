<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspecteur de rendu — relevé des styles calculés</title>
<style>
  :root { --bg:#12100e; --panel:#1c1916; --line:#332e29; --ink:#f2ece4; --dim:#a09589; --acc:#ff7857; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font:600 17px/1.3 system-ui, sans-serif; }
  p.lede { margin:0; color:var(--dim); font:13px/1.5 system-ui, sans-serif; max-width:70ch; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding:16px 22px;
         border-bottom:1px solid var(--line); }
  label { display:flex; flex-direction:column; gap:5px;
          font:11px/1 system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  input, select { background:var(--panel); color:var(--ink); border:1px solid var(--line);
                  border-radius:7px; padding:8px 10px; font:13px/1 inherit; }
  input[type=text] { min-width:340px; }
  button { background:var(--acc); color:#1a1a1a; border:0; border-radius:7px; padding:9px 16px;
           font:600 13px/1 system-ui, sans-serif; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:0; min-height:60vh; }
  #scene { border:0; width:100%; height:78vh; background:#fff; }
  aside { border-left:1px solid var(--line); padding:16px; overflow:auto; max-height:78vh; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; color:var(--ink); }
  .hint { color:var(--dim); font:12px/1.5 system-ui, sans-serif; }
  .tag { display:inline-block; padding:2px 7px; border-radius:5px; background:var(--panel);
         border:1px solid var(--line); color:var(--dim); font-size:11px; margin-right:6px; }
</style>
</head>
<body>

<header>
  <h1>Inspecteur de rendu</h1>
  <p class="lede">Relève les styles <strong>calculés</strong> d'une page de l'export : couleurs, tailles,
  interlignes, rayons, dégradés, positions, images. C'est ce relevé — et non le CSS source, illisible —
  qui permet de reconstruire le rendu à l'identique.</p>
</header>

<div class="bar">
  <label>Page à inspecter
    <input type="text" id="chemin" value="_src/index.html" placeholder="_src/index.html">
  </label>
  <label>Largeur
    <select id="largeur">
      <option value="1440">1440 — bureau</option>
      <option value="1280">1280</option>
      <option value="1024">1024 — tablette</option>
      <option value="390">390 — mobile</option>
    </select>
  </label>
  <label>Zone (sélecteur, vide = page entière)
    <input type="text" id="zone" placeholder="#SITE_HEADER, main, .une-section">
  </label>
  <button id="go">Relever</button>
  <button class="ghost" id="copier">Copier le rapport</button>
  <button class="ghost" id="palette">Palette + polices</button>
</div>

<main>
  <iframe id="scene" src="about:blank"></iframe>
  <aside>
    <p class="hint" id="etat">Renseigne un chemin puis lance le relevé.</p>
    <pre id="rapport"></pre>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const scene = $('#scene');

$('#go').addEventListener('click', () => charger(releve));
$('#palette').addEventListener('click', () => charger(paletteEtPolices));
$('#copier').addEventListener('click', async () => {
  await navigator.clipboard.writeText($('#rapport').textContent);
  $('#etat').textContent = 'Rapport copié.';
});

function charger(suite) {
  const chemin = $('#chemin').value.trim();
  scene.style.width = $('#largeur').value + 'px';
  $('#etat').textContent = 'Chargement de ' + chemin + '…';
  scene.onload = () => { setTimeout(() => suite(scene.contentDocument, scene.contentWindow), 700); };
  scene.src = chemin;
}

const px = v => Math.round(parseFloat(v) || 0);
const court = (s, n) => (s || '').replace(/\s+/g, ' ').trim().slice(0, n);

/* Relevé principal : une ligne par élément visible porteur de sens
   (texte propre, image, lien, fond, rayon, bordure). */
function releve(doc, win) {
  const zone = $('#zone').value.trim();
  const racine = (zone && doc.querySelector(zone)) || doc.body;
  const base = racine.getBoundingClientRect();
  const lignes = [];
  const ignore = ['script', 'style', 'noscript', 'defs', 'path', 'g', 'br', 'svg', 'link', 'meta'];

  racine.querySelectorAll('*').forEach(el => {
    const tag = el.tagName.toLowerCase();
    if (ignore.includes(tag)) return;
    const c = win.getComputedStyle(el);
    if (c.display === 'none' || c.visibility === 'hidden' || c.opacity === '0') return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 && r.height < 1) return;

    const propre = [...el.childNodes].filter(n => n.nodeType === 3)
      .map(n => n.textContent.trim()).filter(Boolean).join(' ');
    const interessant = propre || tag === 'img' || tag === 'a' || tag === 'iframe' ||
      c.backgroundColor !== 'rgba(0, 0, 0, 0)' || c.backgroundImage !== 'none' ||
      px(c.borderTopLeftRadius) > 0 || c.borderTopWidth !== '0px';
    if (!interessant) return;

    const b = [tag + (el.id ? '#' + el.id : '')];
    b.push(Math.round(r.left - base.left) + ',' + Math.round(r.top - base.top) +
           ' ' + Math.round(r.width) + '×' + Math.round(r.height));
    if (propre) b.push('texte="' + court(propre, 110) + '"');
    if (tag === 'img') b.push('img=' + (el.getAttribute('src') || '').split('/').slice(-1)[0].slice(0, 46) +
                              ' fit=' + c.objectFit);
    if (tag === 'a') b.push('href=' + court(el.getAttribute('href'), 50));
    if (propre || tag === 'a') b.push('police=' + c.fontFamily.split(',')[0].replace(/["']/g, '') +
      ' ' + c.fontSize + '/' + c.lineHeight + ' g' + c.fontWeight +
      ' interlettre=' + c.letterSpacing + ' couleur=' + c.color + ' align=' + c.textAlign +
      (c.textTransform !== 'none' ? ' casse=' + c.textTransform : ''));
    if (c.backgroundColor !== 'rgba(0, 0, 0, 0)') b.push('fond=' + c.backgroundColor);
    if (c.backgroundImage !== 'none') b.push('fondimg=' + court(c.backgroundImage, 150));
    if (px(c.borderTopLeftRadius)) b.push('rayon=' + c.borderTopLeftRadius + ' ' + c.borderBottomRightRadius);
    if (c.borderTopWidth !== '0px') b.push('bordure=' + c.borderTopWidth + ' ' + c.borderTopStyle + ' ' + c.borderTopColor);
    if (c.boxShadow !== 'none') b.push('ombre=' + court(c.boxShadow, 70));
    if (c.display === 'flex' || c.display === 'grid')
      b.push('mise-en-page=' + c.display + ' gap=' + c.gap + ' cols=' + court(c.gridTemplateColumns, 40));
    lignes.push(b.join(' | '));
  });

  const images = [...doc.images].map(i => i.getAttribute('src'))
    .filter((v, i, a) => v && a.indexOf(v) === i);

  $('#rapport').textContent =
    '# ' + $('#chemin').value + '  (' + $('#largeur').value + 'px' + (zone ? ', zone ' + zone : '') + ')\n' +
    '# titre : ' + doc.title + '\n' +
    '# ' + lignes.length + ' éléments relevés\n\n' +
    lignes.join('\n') +
    '\n\n# IMAGES (' + images.length + ')\n' + images.map(s => '  ' + s).join('\n');
  $('#etat').innerHTML = '<span class="tag">' + lignes.length + ' éléments</span>' +
                         '<span class="tag">' + images.length + ' images</span>Relevé terminé.';
}

/* Palette, polices et dégradés : à reporter dans les variables de style.css. */
function paletteEtPolices(doc, win) {
  const couleurs = {}, fondsImg = new Set(), fontes = {};
  doc.body.querySelectorAll('*').forEach(el => {
    const c = win.getComputedStyle(el);
    if (c.display === 'none') return;
    const r = el.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return;
    [c.color, c.backgroundColor].forEach(v => {
      if (v && v !== 'rgba(0, 0, 0, 0)') couleurs[v] = (couleurs[v] || 0) + 1;
    });
    if (c.backgroundImage !== 'none' && /gradient/.test(c.backgroundImage)) fondsImg.add(c.backgroundImage);
    const t = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    if (t) {
      const k = c.fontFamily.split(',')[0].replace(/["']/g, '') + ' | ' + c.fontSize + '/' + c.lineHeight + ' | g' + c.fontWeight;
      fontes[k] = (fontes[k] || 0) + 1;
    }
  });

  const tri = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
  const faces = [...doc.querySelectorAll('style')].map(s => s.textContent)
    .join('').match(/@font-face\{[^}]*font-family:([^;}]+)/g) || [];

  $('#rapport').textContent =
    '# COULEURS (par fréquence)\n' +
    tri(couleurs).slice(0, 24).map(([v, n]) => '  ' + String(n).padStart(5) + '×  ' + v).join('\n') +
    '\n\n# STYLES DE TEXTE (par fréquence)\n' +
    tri(fontes).slice(0, 18).map(([v, n]) => '  ' + String(n).padStart(5) + '×  ' + v).join('\n') +
    '\n\n# FAMILLES DÉCLARÉES EN @font-face\n' +
    [...new Set(faces.map(f => f.split('font-family:')[1].trim()))].map(f => '  ' + f).join('\n') +
    '\n\n# DÉGRADÉS\n' + [...fondsImg].map(g => '  ' + g).join('\n\n');
  $('#etat').textContent = 'Palette et polices relevées. Reporter les valeurs dans les variables de style.css.';
}
</script>
</body>
</html>
