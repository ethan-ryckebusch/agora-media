<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrôles de conversion</title>
<script src="site.config.js"></script>
<style>
  :root { --bg:#12100e; --panel:#1c1916; --line:#332e29; --ink:#f2ece4; --dim:#a09589;
          --acc:#ff7857; --ok:#4ec97f; --ko:#ff5f52; --warn:#ffc148; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 system-ui, sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:18px; }
  .lede { margin:0; color:var(--dim); font-size:13px; max-width:74ch; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 24px;
         border-bottom:1px solid var(--line); }
  button { background:var(--acc); color:#1a1a1a; border:0; border-radius:7px; padding:9px 16px;
           font:600 13px/1 system-ui, sans-serif; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button[disabled] { opacity:.45; cursor:default; }
  #etat { color:var(--dim); font-size:13px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
            gap:14px; padding:18px 24px; }
  section.carte { background:var(--panel); border:1px solid var(--line); border-radius:11px;
                  padding:14px 16px; }
  section.carte h2 { margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .pastille { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  .pastille.ok { background:var(--ok); } .pastille.ko { background:var(--ko); }
  .pastille.warn { background:var(--warn); }
  .resume { color:var(--dim); font-size:12px; margin:0 0 8px; }
  ul.liste { margin:0; padding:0 0 0 16px; max-height:230px; overflow:auto;
             font:12px/1.5 ui-monospace, Menlo, monospace; }
  ul.liste li { margin:2px 0; word-break:break-word; }
  ul.liste li b { color:var(--ko); font-weight:600; }
  .visuel { padding:0 24px 28px; }
  .visuel h2 { font-size:15px; margin:18px 0 6px; }
  .paire { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  .paire figure { margin:0; }
  .paire figcaption { color:var(--dim); font-size:12px; padding:4px 0; }
  iframe { border:1px solid var(--line); border-radius:8px; background:#fff; }
  .avant, .apres { width:100%; height:520px; }
  .resp { display:flex; gap:12px; overflow:auto; padding-bottom:6px; }
  .resp figure { margin:0; flex:none; }
  .resp iframe { height:520px; }
  select, input[type=text] { background:var(--panel); color:var(--ink); border:1px solid var(--line);
                             border-radius:7px; padding:8px 10px; font:13px/1 inherit; min-width:260px; }
</style>
</head>
<body>

<header>
  <h1>Contrôles de conversion</h1>
  <p class="lede">Huit contrôles sur toutes les pages générées. À passer intégralement avant livraison :
  tout ce qui est signalé en rouge doit être corrigé.</p>
</header>

<div class="bar">
  <button id="go">Lancer les contrôles</button>
  <button class="ghost" id="copier" disabled>Copier le rapport</button>
  <span id="etat">En attente.</span>
</div>

<div class="grille" id="grille"></div>

<div class="visuel">
  <h2>6. Comparaison avant / après</h2>
  <div class="bar" style="padding-left:0; border:0">
    <select id="choixPage"></select>
    <span id="etatVisuel" style="color:var(--dim);font-size:13px"></span>
  </div>
  <div class="paire">
    <figure><figcaption>Export d'origine</figcaption><iframe class="avant" id="avant"></iframe></figure>
    <figure><figcaption>Version reprise</figcaption><iframe class="apres" id="apres"></iframe></figure>
  </div>

  <h2>7. Rendu responsive</h2>
  <div class="resp" id="resp"></div>
</div>

<script>
const S = window.SITE;
const $ = s => document.querySelector(s);
const rapport = [];

/* ---------------------------------------------------- Découverte des pages
   Les outils vivent dans outils/ : la racine du site est un cran au-dessus.
   Toutes les pages sont manipulées en chemin relatif à cette racine. */
const RACINE = new URL('../', location.href).href;
const versRacine = u => decodeURIComponent(new URL(encodeURI(u), RACINE).href.slice(RACINE.length));
const depuisRacine = p => RACINE + encodeURI(p);

async function decouvrir() {
  const vues = new Set(['index.html']);
  const file = ['index.html'];
  const pages = [];
  while (file.length) {
    const p = file.shift();
    const t = await lire(p);
    if (t === null) continue;
    pages.push({ chemin: p, html: t });
    const doc = new DOMParser().parseFromString(t, 'text/html');
    const dir = p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
    doc.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (!h || /^(https?:|mailto:|#|data:)/.test(h)) return;
      const rel = versRacine(dir + h.split('#')[0]);
      if (!rel.endsWith('.html')) return;
      if (S.ignorer.some(i => rel.startsWith(i))) return;
      if (!vues.has(rel)) { vues.add(rel); file.push(rel); }
    });
  }
  return pages;
}

async function lire(p) {
  try { const r = await fetch(depuisRacine(p)); return r.ok ? await r.text() : null; }
  catch (e) { return null; }
}

/* --------------------------------------------------------- Les 8 contrôles */

// 1. Liens internes
async function liensInternes(pages) {
  const cibles = {};
  pages.forEach(({ chemin, html }) => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const dir = chemin.includes('/') ? chemin.slice(0, chemin.lastIndexOf('/') + 1) : '';
    doc.querySelectorAll('[href],[src]').forEach(e => {
      const u = e.getAttribute('href') || e.getAttribute('src');
      if (!u || /^(https?:|mailto:|#|data:)/.test(u)) return;
      const t = versRacine(dir + u.split('#')[0]);
      (cibles[t] = cibles[t] || new Set()).add(chemin);
    });
  });
  const clefs = Object.keys(cibles);
  const etats = await Promise.all(clefs.map(t => fetch(depuisRacine(t)).then(r => r.ok).catch(() => false)));
  const casses = clefs.filter((t, i) => !etats[i]);
  return {
    titre: '1. Liens internes',
    resume: clefs.length + ' cibles distinctes vérifiées sur ' + pages.length + ' pages',
    problemes: casses.map(t => t + '  ← ' + [...cibles[t]].slice(0, 3).join(', '))
  };
}

// 2. Mentions de la plateforme d'origine
function mentions(pages) {
  const trouves = [];
  pages.forEach(({ chemin, html }) => {
    const bas = html.toLowerCase();
    S.motsInterdits.forEach(m => {
      let i = bas.indexOf(m.toLowerCase());
      while (i > -1) {
        trouves.push(chemin + ' → “' + m + '” : …' + html.slice(Math.max(0, i - 40), i + 40).replace(/\s+/g, ' ') + '…');
        i = bas.indexOf(m.toLowerCase(), i + 1);
        if (trouves.length > 60) return;
      }
    });
  });
  return {
    titre: '2. Mentions de la plateforme',
    resume: 'Recherche de : ' + S.motsInterdits.join(', '),
    problemes: trouves,
    note: 'Le contenu juridique (hébergeur dans les mentions légales) est légitime : le signaler au client sans le réécrire.'
  };
}

// 3. Images manquantes ou basse résolution
async function images(pages) {
  const srcs = {};
  pages.forEach(({ chemin, html }) => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const dir = chemin.includes('/') ? chemin.slice(0, chemin.lastIndexOf('/') + 1) : '';
    doc.querySelectorAll('img[src]').forEach(im => {
      const u = im.getAttribute('src');
      if (/^(https?:|data:)/.test(u)) return;
      const t = versRacine(dir + u);
      (srcs[t] = srcs[t] || { pages: new Set(), attendu: 0 }).pages.add(chemin);
      srcs[t].attendu = Math.max(srcs[t].attendu, parseInt(im.getAttribute('width') || 0, 10) || 0);
    });
  });
  const clefs = Object.keys(srcs);
  const mesures = await Promise.all(clefs.map(u => new Promise(res => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => res(null);
    im.src = depuisRacine(u);
  })));
  const pb = [];
  clefs.forEach((u, i) => {
    const nom = u.split('/').pop();
    const m = mesures[i];
    if (!m) { pb.push('MANQUANTE  ' + nom); return; }
    const article = /\/articles\//.test(u);
    if (article && m.w < S.largeurImageMin) pb.push('BASSE DÉF  ' + nom + '  ' + m.w + '×' + m.h +
      ' (minimum attendu ' + S.largeurImageMin + 'px)');
    else if (srcs[u].attendu && m.w < srcs[u].attendu)
      pb.push('TROP PETITE  ' + nom + '  ' + m.w + 'px pour un affichage à ' + srcs[u].attendu + 'px');
  });
  return { titre: '3. Images', resume: clefs.length + ' images locales mesurées', problemes: pb };
}

// 4. Validité HTML
function validite(pages) {
  const pb = [];
  pages.forEach(({ chemin, html }) => {
    // attributs parasites nés d'un guillemet non échappé
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('meta').forEach(m => {
      if (m.attributes.length > 2)
        pb.push(chemin + ' → <meta> à ' + m.attributes.length + ' attributs (guillemet non échappé ?)');
    });
    doc.querySelectorAll('[href=""], [src=""]').forEach(() =>
      pb.push(chemin + ' → attribut href ou src vide'));
    // balises structurantes non fermées
    ['div', 'section', 'article', 'main', 'a', 'p', 'ul', 'li'].forEach(t => {
      const o = (html.match(new RegExp('<' + t + '[\\s>]', 'g')) || []).length;
      const f = (html.match(new RegExp('</' + t + '>', 'g')) || []).length;
      if (o !== f) pb.push(chemin + ' → <' + t + '> : ' + o + ' ouvertes / ' + f + ' fermées');
    });
    if (!/<html lang="/.test(html)) pb.push(chemin + ' → attribut lang absent sur <html>');
  });
  return { titre: '4. Validité HTML', resume: pages.length + ' pages analysées', problemes: pb };
}

// 5. Metas et titres
function seo(pages) {
  const pb = [];
  const titres = {};
  pages.forEach(({ chemin, html }) => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const t = (doc.title || '').trim();
    const d = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '').trim();
    const h1 = doc.querySelectorAll('h1').length;
    if (!t) pb.push(chemin + ' → <title> absent');
    else if (t.length > 70) pb.push(chemin + ' → <title> de ' + t.length + ' caractères (70 max conseillé)');
    if (t) (titres[t] = titres[t] || []).push(chemin);
    if (!d) pb.push(chemin + ' → meta description absente ou vide');
    else if (d.length < 50) pb.push(chemin + ' → description de ' + d.length + ' caractères (trop courte)');
    else if (d.length > 200) pb.push(chemin + ' → description de ' + d.length + ' caractères (200 max)');
    if (!doc.querySelector('meta[property="og:title"]')) pb.push(chemin + ' → og:title absent');
    if (h1 === 0) pb.push(chemin + ' → aucun <h1>');
    if (h1 > 1) pb.push(chemin + ' → ' + h1 + ' balises <h1>');
  });
  Object.entries(titres).forEach(([t, ps]) => {
    if (ps.length > 1) pb.push('titre en double sur ' + ps.length + ' pages : “' + t.slice(0, 50) + '”');
  });
  return { titre: '5. Metas et titres', resume: pages.length + ' pages analysées', problemes: pb };
}

// 8. Pages non converties
async function nonConverties(pages) {
  return {
    titre: '8. Pages non converties',
    resume: pages.length + ' pages atteignables depuis l’accueil.' +
      (S.source ? ' À comparer avec le contenu de ' + S.source + ' : le navigateur ne peut pas lister un dossier, '
                + 'vérifier la liste à la main.' : ' Export d’origine absent du projet.'),
    problemes: pages.filter(p => !/<main[\s>]/.test(p.html)).map(p => p.chemin + ' → pas de <main> : page incomplète ?'),
    avertissement: true
  };
}
const sansAccent = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

/* ------------------------------------------------------------- Restitution */
function afficher(res) {
  const pb = res.problemes || [];
  const etat = res.neutre ? '' : (pb.length ? (res.avertissement ? 'warn' : 'ko') : 'ok');
  const el = document.createElement('section');
  el.className = 'carte';
  el.innerHTML = '<h2><span class="pastille ' + etat + '"></span>' + res.titre + '</h2>' +
    '<p class="resume">' + res.resume + '</p>' +
    (pb.length
      ? '<ul class="liste">' + pb.slice(0, 80).map(t => '<li>' + esc(t) + '</li>').join('') +
        (pb.length > 80 ? '<li><b>… et ' + (pb.length - 80) + ' autres</b></li>' : '') + '</ul>'
      : (res.neutre ? '' : '<p class="resume" style="color:var(--ok)">Aucun problème.</p>')) +
    (res.note ? '<p class="resume" style="margin-top:8px">' + res.note + '</p>' : '');
  $('#grille').appendChild(el);
  rapport.push('## ' + res.titre + '\n' + res.resume + '\n' +
    (pb.length ? pb.map(t => '  - ' + t).join('\n') : '  aucun problème') + '\n');
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ------------------------------------------------ Comparaison et responsive */
function preparerVisuel(pages) {
  const sel = $('#choixPage');
  sel.innerHTML = pages.map(p => '<option value="' + p.chemin + '">' + p.chemin + '</option>').join('');
  sel.onchange = () => montrer(sel.value);
  montrer(pages[0].chemin);
}

function montrer(chemin) {
  $('#apres').src = depuisRacine(chemin);
  if (S.source) {
    $('#avant').src = depuisRacine(S.source + sansAccent(chemin.split('/').pop()));
    $('#etatVisuel').textContent = 'Si le panneau de gauche est vide, la page d’origine porte un autre nom dans ' + S.source + '.';
  } else {
    $('#avant').srcdoc = '<p style="font:14px system-ui;padding:20px;color:#666">Export d’origine absent du projet (champ <code>source</code> vide dans site.config.js).</p>';
    $('#etatVisuel').textContent = '';
  }
  const resp = $('#resp');
  resp.innerHTML = [[390, 'Mobile'], [768, 'Tablette'], [1440, 'Bureau']].map(([w, n]) =>
    '<figure><figcaption style="color:var(--dim);font-size:12px">' + n + ' — ' + w + 'px</figcaption>' +
    '<iframe src="' + depuisRacine(chemin) + '" style="width:' + w + 'px"></iframe></figure>').join('');
}

/* ------------------------------------------------------------------ Lancement */
$('#go').addEventListener('click', async () => {
  $('#go').disabled = true;
  $('#grille').innerHTML = '';
  rapport.length = 0;
  $('#etat').textContent = 'Découverte des pages…';
  const pages = await decouvrir();
  $('#etat').textContent = pages.length + ' pages trouvées. Contrôles en cours…';

  afficher(await liensInternes(pages));
  afficher(mentions(pages));
  afficher(await images(pages));
  afficher(validite(pages));
  afficher(seo(pages));
  afficher(await nonConverties(pages));

  const total = rapport.join('\n').match(/^  - /gm)?.length || 0;
  $('#etat').textContent = pages.length + ' pages, ' + total + ' point(s) à corriger.';
  $('#copier').disabled = false;
  preparerVisuel(pages);
});

$('#copier').addEventListener('click', async () => {
  await navigator.clipboard.writeText('# Contrôles de conversion — ' + S.nom + '\n\n' + rapport.join('\n'));
  $('#etat').textContent = 'Rapport copié.';
});
</script>
</body>
</html>
